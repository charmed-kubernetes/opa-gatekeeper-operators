name: Test Suite
on: [pull_request]

jobs:
  call-inclusive-naming-check:
    name: Inclusive naming
    uses: canonical/inclusive-naming/.github/workflows/woke.yaml@7aa0f7a606f182bd03a7adb28e0d710216101ca5 # main
    with:
      fail-on-error: "true"

  lint-unit:
    name: Lint Unit
    uses: charmed-kubernetes/workflows/.github/workflows/lint-unit.yaml@6ee58c37d404effad4598ce7b523dbaf0cb99285 # main
    needs:
      - call-inclusive-naming-check
    with:
      python: "['3.10', '3.12']"

  integration-test:
    name: Integration tests
    runs-on: ubuntu-latest
    needs:
      - lint-unit
    steps:
    - name: Check out code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
    - name: Setup Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
      with:
        python-version: 3.12
    - name: Read charmcraft version file
      id: charmcraft
      run: echo "channel=$(cat .charmcraft-channel)" >> $GITHUB_OUTPUT
    - name: Setup operator environment
      uses: charmed-kubernetes/actions-operator@ea90ed489690bf3b1c1fcca6ac5f9edab70aecb0 # main
      with:
        provider: microk8s
        channel: 1.34-strict/stable
        charmcraft-channel: ${{ steps.charmcraft.outputs.channel }}
    - name: Run test
      run: tox -e integration
    - name: Setup Debug Artifact Collection
      if: ${{ failure() }}
      run: mkdir tmp
    - name: Collect Juju Status
      if: ${{ failure() }}
      run: |
        juju status 2>&1 | tee tmp/juju-status.txt
    - name: Collect Juju logs for gatekeeper-manager-operator
      if: ${{ failure() }}
      run: sudo juju debug-log --replay --no-tail -i gatekeeper-manager-operator | tee tmp/unit-gatekeeper-manager-operator-0.log
    - name: Upload debug artifacts
      if: ${{ failure() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: test-run-artifacts
        path: tmp
